<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Product</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">🛒 Shop</div>
    <a href="index.html" class="add-btn">← Back</a>
</nav>

<!-- FORM -->
<div class="form-page">

    <div class="form-card">

        <h2>Edit Product</h2>

        <form id="editForm">

            <div class="form-grid">

                <input type="text" id="name" placeholder="Product Name" required>

                <input type="text" id="brand" placeholder="Brand">

                <!-- CATEGORY DROPDOWN -->
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="smartphone">Smartphone</option>
                    <option value="electronics">Electronics</option>
                    <option value="laptop">Laptop</option>
                    <option value="fashion">Fashion</option>
                </select>

                <input type="number" id="price" placeholder="Price">

                <input type="number" id="quantity" placeholder="Stock Quantity">

                <input type="date" id="releaseDate">

            </div>

            <!-- FULL WIDTH -->
            <textarea id="description" placeholder="Product Description"></textarea>

           <!-- IMAGE SECTION -->
<div class="image-section">

    <!-- CURRENT IMAGE -->
    <img id="previewImage" src="" alt="Product Image">

    <!-- UPLOAD NEW IMAGE -->
    <label class="upload-label">Change Image (optional)</label>
    <input type="file" id="image">

</div>

            <button type="submit" class="primary-btn">Update Product</button>

        </form>

    </div>

</div>


<script src="edit.js"></script>

</body>
</html>
